name: image

# Builds ghcr.io/bkazez/arc-runtime for every platform below, proves arc and
# its separator run on each, and pushes them as one multi-platform tag. Only
# when the runtime itself changes, plus monthly for Debian's security updates:
# arc goes on top of it in the images that use it.
on:
  push:
    branches: [main]
    paths: [Dockerfile, install.sh, smoke.sh, .github/workflows/image.yml]
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/bkazez/arc-runtime

jobs:
  image:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: arch
        run: echo "name=${PLATFORM#linux/}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: arc-runtime:test
          cache-from: type=gha,scope=${{ steps.arch.outputs.name }}
          cache-to: type=gha,mode=max,scope=${{ steps.arch.outputs.name }}
      - name: Smoke test
        run: docker run --rm -v "$PWD/smoke.sh:/smoke.sh:ro" arc-runtime:test bash /smoke.sh
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.arch.outputs.name }}
      - run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
          docker image inspect arc-runtime:test --format '{{.Size}}' | awk '{printf "size: %.0f MB\n", $1/1e6}'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ steps.arch.outputs.name }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  publish:
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the multi-platform tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          dated="$IMAGE:$(date -u +%Y-%m-%d)-${GITHUB_SHA::7}"
          docker buildx imagetools create -t "$IMAGE:latest" -t "$dated" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:latest"
