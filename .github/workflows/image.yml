name: image

# Builds ghcr.io/bkazez/arc-runtime, proves arc and its separator run on it,
# and pushes it. Only when the runtime itself changes, plus monthly for
# Debian's security updates: arc goes on top of it in the images that use it.
on:
  push:
    branches: [main]
    paths: [Dockerfile, install.sh, smoke.sh, .github/workflows/image.yml]
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: arc-runtime:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: docker run --rm -v "$PWD/smoke.sh:/smoke.sh:ro" arc-runtime:test bash /smoke.sh
      - name: Push
        run: |
          tag="ghcr.io/bkazez/arc-runtime"
          dated="$tag:$(date -u +%Y-%m-%d)-${GITHUB_SHA::7}"
          docker tag arc-runtime:test "$tag:latest"
          docker tag arc-runtime:test "$dated"
          docker push "$tag:latest"
          docker push "$dated"
          docker image inspect arc-runtime:test --format '{{.Size}}' | awk '{printf "size: %.0f MB\n", $1/1e6}'
